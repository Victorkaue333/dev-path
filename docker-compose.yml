# PostgreSQL local para desenvolvimento do DevPath.
# Uso: `pnpm db:up` (ou `docker compose up -d postgres`). Não é usado em produção.
# Os valores padrão abaixo valem apenas para a máquina local e coincidem com .env.example.
services:
  postgres:
    image: postgres:17-alpine
    container_name: devpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpath}
      POSTGRES_DB: ${POSTGRES_DB:-devpath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devpath-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpath} -d ${POSTGRES_DB:-devpath}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devpath-postgres-data:
