<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 168" role="img">
  <title>Monitor CRT retrô em estilo adesivo</title>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- halo de adesivo (gabinete + base) -->
    <path d="M22 16h140l6 6v96l-6 6H22l-6-6V22z M60 124h64v10H60z M40 134h104l8 14H32z" fill="#F8FAEC" stroke="#F8FAEC" stroke-width="16"/>
    <!-- base -->
    <path d="M40 134h104l8 14H32z" fill="#F8FAEC" stroke="#0F172A" stroke-width="5.5"/>
    <path d="M60 124h64v10H60z" fill="#F8FAEC" stroke="#0F172A" stroke-width="5"/>
    <!-- gabinete -->
    <path d="M22 16h140l6 6v96l-6 6H22l-6-6V22z" fill="#F8FAEC" stroke="#0F172A" stroke-width="6"/>
    <!-- tela -->
    <rect x="30" y="28" width="108" height="78" rx="8" fill="#0F172A" stroke="#0F172A" stroke-width="5"/>
    <path d="M30 70h108" stroke="#22C55E" stroke-opacity="0.15" stroke-width="20"/>
    <!-- prompt na tela -->
    <path d="M44 48l12 10-12 10" fill="none" stroke="#22C55E" stroke-width="5"/>
    <path d="M64 70h16" stroke="#22C55E" stroke-width="5"/>
    <rect x="86" y="64" width="8" height="12" fill="#22C55E"/>
    <!-- botões -->
    <circle cx="152" cy="46" r="5" fill="#FB7171" stroke="#0F172A" stroke-width="3"/>
    <circle cx="152" cy="64" r="5" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
    <path d="M146 84h12M146 92h12" stroke="#0F172A" stroke-opacity="0.5" stroke-width="2.5"/>
    <!-- ventilação -->
    <path d="M40 114h60" stroke="#0F172A" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="4 4"/>
    <!-- brilho e desgaste -->
    <path d="M28 24h50" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5"/>
    <path d="M36 40c4 8 4 18 2 28" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M150 110l8-6" stroke="#0F172A" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
