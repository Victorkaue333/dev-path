<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 140" role="img">
  <title>Janela de terminal retrô em estilo adesivo</title>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- halo de adesivo -->
    <rect x="16" y="18" width="152" height="106" rx="10" fill="#F8FAEC" stroke="#F8FAEC" stroke-width="16"/>
    <!-- janela -->
    <rect x="16" y="18" width="152" height="106" rx="10" fill="#0F172A" stroke="#0F172A" stroke-width="6"/>
    <!-- barra de título -->
    <path d="M16 44h152" stroke="#F8FAEC" stroke-opacity="0.35" stroke-width="2.5"/>
    <circle cx="32" cy="31" r="5" fill="#FB7171" stroke="#F8FAEC" stroke-width="1.5"/>
    <circle cx="48" cy="31" r="5" fill="#FBBF24" stroke="#F8FAEC" stroke-width="1.5"/>
    <circle cx="64" cy="31" r="5" fill="#22C55E" stroke="#F8FAEC" stroke-width="1.5"/>
    <!-- grade sutil da tela -->
    <path d="M30 60h124M30 76h124M30 92h124M30 108h124" stroke="#22C55E" stroke-opacity="0.12" stroke-width="1.5"/>
    <!-- prompt >_ -->
    <path d="M36 62l16 14-16 14" fill="none" stroke="#F8FAEC" stroke-width="7"/>
    <path d="M62 92h20" stroke="#F8FAEC" stroke-width="7"/>
    <!-- cursor verde -->
    <rect x="90" y="84" width="10" height="14" fill="#22C55E"/>
    <!-- fita no canto -->
    <g transform="rotate(-18 34 22)">
      <path d="M12 16l40 1 2 4-2 5 1 5-1 5-40 1-3-5 2-6-2-5z" fill="#F8FAEC" fill-opacity="0.9" stroke="#0F172A" stroke-width="3"/>
      <path d="M20 19l3 14M34 18l3 15M46 19l2 14" stroke="#0F172A" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <!-- brilho -->
    <path d="M28 50h40" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
